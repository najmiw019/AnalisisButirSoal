<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisis Butir Soal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4ff;color:#1a1a2e;min-height:100vh}
header{background:linear-gradient(135deg,#667eea,#764ba2);padding:32px 40px;color:#fff;text-align:center}
header .hinner{display:flex;align-items:center;gap:12px;justify-content:center}
header h1{font-size:1.9rem;font-weight:700;letter-spacing:.01em;line-height:1}
nav{background:#fff;border-bottom:2px solid #e8eaf6;padding:0 40px;display:flex;gap:0;overflow-x:auto;justify-content:center;align-items:center}
nav button{background:none;border:none;padding:14px 22px;font-size:.85rem;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;letter-spacing:.03em;display:inline-flex;align-items:center;gap:7px}
nav button:hover{color:#667eea}
nav button.active{color:#667eea;border-bottom-color:#667eea}
.container{max-width:1200px;margin:0 auto;padding:28px 40px}
.tab-content{display:none}.tab-content.active{display:block}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 2px 12px rgba(102,126,234,.1)}
.stat-card .sv{font-size:2.2rem;font-weight:700;line-height:1}
.stat-card .sl{font-size:.75rem;color:#888;margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(102,126,234,.08)}
.card h2{font-size:1.1rem;font-weight:700;margin-bottom:16px;color:#2d3561}
.formula-box{background:#f0f4ff;border-left:4px solid #667eea;padding:14px 18px;border-radius:0 10px 10px 0;font-family:'Courier New',monospace;font-size:.82rem;color:#3c4db0;margin-bottom:14px;line-height:1.8}
.info{font-size:.84rem;color:#666;margin-bottom:14px;line-height:1.7}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid #e8eaf6}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{background:#f5f6ff;color:#667eea;text-transform:uppercase;font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:11px 12px;text-align:center;border-bottom:2px solid #e8eaf6}
td{padding:10px 12px;text-align:center;border-bottom:1px solid #f0f0f8}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.num-dot{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin:0 auto}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.04em}
.p-valid{background:#e8f5e9;color:#2e7d32}
.p-invalid{background:#ffebee;color:#c62828}
.p-mudah{background:#e8f5e9;color:#2e7d32}
.p-sedang{background:#fff8e1;color:#e65100}
.p-sukar{background:#ffebee;color:#c62828}
.p-baiksekali{background:#e8f5e9;color:#1b5e20}
.p-baik{background:#ede7f6;color:#4527a0}
.p-cukup{background:#fff8e1;color:#e65100}
.p-jelek{background:#ffebee;color:#c62828}
.p-sjelek{background:#ffcdd2;color:#b71c1c}
.mini-bar-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.mini-bar-row{display:flex;align-items:center;gap:10px}
.mini-bar-lbl{width:80px;font-size:.78rem;color:#666;text-align:right;flex-shrink:0}
.mini-bar-track{flex:1;background:#f0f0f8;border-radius:6px;height:24px;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;font-size:.72rem;font-weight:700;color:#fff}
.mini-bar-count{width:36px;font-size:.78rem;color:#666;flex-shrink:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.sub-card{background:#f5f6ff;border-radius:12px;padding:16px}
.sub-card h3{font-size:.78rem;font-weight:700;color:#667eea;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.r11-big{text-align:center;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;padding:30px;color:#fff;margin-bottom:18px}
.r11-big .rv{font-size:4.5rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.r11-big .rc{font-size:1.2rem;font-weight:600;margin-top:8px;opacity:.9}
.r11-big .rf{font-size:.78rem;opacity:.7;margin-top:10px;font-family:'Courier New',monospace}
.skor-benar{color:#2e7d32;font-weight:700}
.skor-salah{color:#c62828}
.crit-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px}
.crit-table th{background:#f5f6ff;color:#667eea;padding:8px 14px;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.crit-table td{padding:8px 14px;border-bottom:1px solid #f0f0f8;color:#444}
.crit-table tr:last-child td{border-bottom:none}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.72rem;font-weight:600}
.progress-strip{display:flex;gap:2px;margin-top:8px;height:10px;border-radius:6px;overflow:hidden}
.progress-seg{height:100%}
@media(max-width:700px){.stats-row{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}.container{padding:16px}}
</style>
</head>
<body>

<header>
  <div class="hinner">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-4"/></svg>
    <h1>Analisis Butir Soal</h1>
  </div>
</header>

<nav>
  <button class="active" onclick="showTab('dashboard',this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Dashboard</button>
  <button onclick="showTab('skor',this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg> Skor Siswa</button>
  <button onclick="showTab('validitas',this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Validitas</button>
  <button onclick="showTab('kesukaran',this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Tingkat Kesukaran</button>
  <button onclick="showTab('pembeda',this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Daya Pembeda</button>
  <button onclick="showTab('reliabilitas',this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Reliabilitas</button>
</nav>

<div class="container">
  <div id="tab-dashboard" class="tab-content active"></div>
  <div id="tab-skor" class="tab-content"></div>
  <div id="tab-validitas" class="tab-content"></div>
  <div id="tab-kesukaran" class="tab-content"></div>
  <div id="tab-pembeda" class="tab-content"></div>
  <div id="tab-reliabilitas" class="tab-content"></div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────
const kunci=['A','B','B','A','C','C','A','C','D','E','E','D','D','C','C','B','B','A','A','E'];
const siswaRaw=[
  {n:'Siswa 1',  j:['B','B','A','B','A','C','C','C','B','A','E','D','D','C','C','B','B','C','B','B']},
  {n:'Siswa 2',  j:['A','A','B','B','A','C','C','A','C','A','C','D','E','E','C','B','B','A','A','A']},
  {n:'Siswa 3',  j:['B','B','B','A','C','C','C','A','D','E','E','D','D','C','C','B','B','C','B','B']},
  {n:'Siswa 4',  j:['A','A','B','B','A','D','C','A','D','E','E','D','D','C','C','C','B','B','A','E']},
  {n:'Siswa 5',  j:['B','A','B','A','D','C','A','C','D','E','E','A','C','C','A','D','B','B','C','B']},
  {n:'Siswa 6',  j:['B','B','A','D','C','A','C','D','E','E','D','D','D','E','C','B','B','A','A','C']},
  {n:'Siswa 7',  j:['A','B','B','A','D','C','A','C','C','A','C','D','E','E','C','B','B','A','C','B']},
  {n:'Siswa 8',  j:['C','A','C','D','E','E','D','D','D','E','E','D','D','C','C','A','C','D','E','E']},
  {n:'Siswa 9',  j:['A','B','B','C','A','C','D','E','E','D','D','A','C','C','A','C','D','E','B','B']},
  {n:'Siswa 10', j:['A','C','C','A','C','D','E','E','D','E','B','B','A','C','C','B','B','C','B','B']},
  {n:'Siswa 11', j:['C','C','A','A','D','A','A','A','B','B','C','A','B','C','D','D','E','E','A','E']},
  {n:'Siswa 12', j:['A','A','C','C','A','A','D','A','A','A','B','B','C','A','B','C','D','D','E','A']},
  {n:'Siswa 13', j:['A','C','A','A','A','C','A','A','D','B','B','C','A','B','C','D','D','C','C','X']},
  {n:'Siswa 14', j:['B','B','A','A','A','A','B','B','A','C','C','A','C','D','E','E','A','B','B','A']},
  {n:'Siswa 15', j:['C','A','C','D','E','E','D','D','C','C','B','B','A','C','C','A','C','D','E','D']},
  {n:'Siswa 16', j:['D','C','C','B','B','A','A','A','A','A','B','E','E','B','B','A','C','A','C','D']},
  {n:'Siswa 17', j:['E','E','D','D','E','A','C','C','A','C','D','E','E','D','D','B','B','A','C','C']},
  {n:'Siswa 18', j:['B','B','A','A','C','A','B','C','A','C','C','C','C','A','C','C','A','C','D','E']},
  {n:'Siswa 19', j:['E','B','B','A','E','A','B','B','A','C','C','E','E','D','D','E','D','D','B','B']},
  {n:'Siswa 20', j:['A','B','A','A','E','B','A','C','A','C','D','E','E','D','D','E','D','D','B','B']},
];

// ─── HITUNG SKOR ────────────────────────────────────────────
const N=20, n=20;
const data=siswaRaw.map(s=>{
  let total=0;
  const correct=kunci.map((k,i)=>{const r=s.j[i]===k;if(r)total++;return r?1:0});
  return{...s,correct,total};
});

const sorted=[...data].sort((a,b)=>b.total-a.total);
const upper=sorted.slice(0,10), lower=sorted.slice(10,20);
const totalScores=data.map(d=>d.total);
const Mt=totalScores.reduce((a,b)=>a+b,0)/N;
const variance=totalScores.reduce((a,b)=>a+(b-Mt)**2,0)/N;
const St=Math.sqrt(variance);

// ─── ANALISIS PER BUTIR ──────────────────────────────────────
const items=kunci.map((k,i)=>{
  const cor=data.filter(d=>d.correct[i]===1);
  const B=cor.length, P=B/N, q=1-P;
  const tkCat=P<0.30?'Sukar':P<=0.70?'Sedang':'Mudah';
  const BA=upper.filter(d=>d.correct[i]===1).length;
  const BB=lower.filter(d=>d.correct[i]===1).length;
  const PA=BA/10, PB=BB/10, D=PA-PB;
  const dpCat=D<0?'Sangat Jelek':D<0.20?'Jelek':D<0.40?'Cukup':D<0.70?'Baik':'Baik Sekali';
  const Mp=cor.length>0?cor.reduce((a,d)=>a+d.total,0)/cor.length:0;
  const sqrtpq=P>0&&q>0?Math.sqrt(P/q):0;
  const rpbis=St>0?((Mp-Mt)/St)*sqrtpq:0;
  return{i,k,B,P,q,tkCat,BA,BB,PA,PB,D,dpCat,Mp,rpbis,valid:rpbis>=0.30,pq:P*q};
});

// ─── KR-20 ───────────────────────────────────────────────────
const sumPQ=items.reduce((a,it)=>a+it.pq,0);
const r11=(n/(n-1))*(1-sumPQ/variance);
function r11Cat(r){return r>=0.80?'Sangat Tinggi':r>=0.60?'Tinggi':r>=0.40?'Cukup':r>=0.20?'Rendah':'Sangat Rendah'}

// ─── HELPERS ─────────────────────────────────────────────────
function f(v,d=3){return (+v).toFixed(d)}
const dotBg=['#667eea','#11998e','#f093fb','#f5576c','#fda085','#4facfe','#43e97b','#fa709a','#fee140','#a18cd1','#fccb90','#d57eeb','#89f7fe','#ff9a9e','#a1c4fd','#c2e9fb','#ffecd2','#fcb69f','#ff9a9e','#a18cd1'];
function dot(i){return`<div class="num-dot" style="background:${dotBg[i%dotBg.length]}">${i+1}</div>`}
function pValid(v){return v?'<span class="pill p-valid">Valid</span>':'<span class="pill p-invalid">Tidak Valid</span>'}
function pTK(c){return`<span class="pill p-${c.toLowerCase()}">${c}</span>`}
function pDP(c){const m={'Baik Sekali':'baiksekali',Baik:'baik',Cukup:'cukup',Jelek:'jelek','Sangat Jelek':'sjelek'};return`<span class="pill p-${m[c]||'cukup'}">${c}</span>`}

// ─── RENDER TABS ─────────────────────────────────────────────
const validCount=items.filter(it=>it.valid).length;
const mudah=items.filter(it=>it.tkCat==='Mudah').length;
const sedang=items.filter(it=>it.tkCat==='Sedang').length;
const sukar=items.filter(it=>it.tkCat==='Sukar').length;
const baikDP=items.filter(it=>it.dpCat==='Baik'||it.dpCat==='Baik Sekali').length;

// DASHBOARD
document.getElementById('tab-dashboard').innerHTML=`
<div class="stats-row">
  <div class="stat-card"><div class="sv" style="color:#667eea">${N}</div><div class="sl">Peserta Didik</div></div>
  <div class="stat-card"><div class="sv" style="color:#11998e">${validCount}</div><div class="sl">Soal Valid</div></div>
  <div class="stat-card"><div class="sv" style="color:#f5576c">${baikDP}</div><div class="sl">Daya Pembeda Baik</div></div>
  <div class="stat-card"><div class="sv" style="color:#764ba2">${f(r11,3)}</div><div class="sl">Reliabilitas KR-20</div></div>
</div>
<div class="stats-row">
  <div class="stat-card"><div class="sv" style="color:#fda085">${f(Mt,2)}</div><div class="sl">Rata-rata Skor</div></div>
  <div class="stat-card"><div class="sv" style="color:#11998e">${mudah}</div><div class="sl">Soal Mudah</div></div>
  <div class="stat-card"><div class="sv" style="color:#fda085">${sedang}</div><div class="sl">Soal Sedang</div></div>
  <div class="stat-card"><div class="sv" style="color:#f5576c">${sukar}</div><div class="sl">Soal Sukar</div></div>
</div>
<div class="card">
  <h2>Rekap Semua Butir Soal</h2>
  <div class="tbl-wrap"><table>
  <thead><tr><th>No</th><th>Kunci</th><th>Jml Benar</th><th>P (TK)</th><th>Kategori TK</th><th>D (DP)</th><th>Kategori DP</th><th>r_pbis</th><th>Validitas</th></tr></thead>
  <tbody>${items.map(it=>`<tr>
    <td>${dot(it.i)}</td><td><b>${it.k}</b></td><td>${it.B}</td>
    <td>${f(it.P)}</td><td>${pTK(it.tkCat)}</td>
    <td>${f(it.D)}</td><td>${pDP(it.dpCat)}</td>
    <td><b>${f(it.rpbis)}</b></td><td>${pValid(it.valid)}</td>
  </tr>`).join('')}</tbody>
  </table></div>
</div>`;

// SKOR SISWA
const rankMap={};sorted.forEach((s,i)=>rankMap[s.n]=i+1);
document.getElementById('tab-skor').innerHTML=`
<div class="card">
  <h2>Data Jawaban & Skor Siswa</h2>
  <div class="tbl-wrap"><table>
  <thead><tr><th>Nama</th>${kunci.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>Total</th><th>Rank</th></tr>
  <tr style="background:#f0f4ff"><th>Kunci</th>${kunci.map(k=>`<th style="color:#667eea">${k}</th>`).join('')}<th>—</th><th>—</th></tr></thead>
  <tbody>${data.map(d=>`<tr>
    <td style="text-align:left;font-weight:600;white-space:nowrap">${d.n}</td>
    ${d.correct.map((c,i)=>`<td class="${c?'skor-benar':'skor-salah'}">${d.j[i]}</td>`).join('')}
    <td><b>${d.total}</b></td>
    <td style="color:${rankMap[d.n]<=10?'#667eea':'#aaa'};font-weight:600">#${rankMap[d.n]}</td>
  </tr>`).join('')}</tbody>
  </table></div>
</div>`;

// VALIDITAS
document.getElementById('tab-validitas').innerHTML=`
<div class="card">
  <h2>Validitas Butir Soal</h2>
  <div class="formula-box">r_pbis = ((M_p - M_t) / S_t) × √(p/q)</div>
  <p class="info">Kriteria: r_pbis ≥ 0,30 → <b>Valid</b> &nbsp;|&nbsp; r_pbis &lt; 0,30 → <b>Tidak Valid</b></p>
  <div class="two-col">
    <div class="sub-card">
      <h3>Distribusi validitas</h3>
      <div class="mini-bar-wrap">
        <div class="mini-bar-row">
          <span class="mini-bar-lbl">Valid</span>
          <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${validCount/20*100}%;background:#2e7d32">${validCount} soal</div></div>
          <span class="mini-bar-count">${validCount}</span>
        </div>
        <div class="mini-bar-row">
          <span class="mini-bar-lbl">Tidak Valid</span>
          <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${(20-validCount)/20*100}%;background:#c62828">${20-validCount} soal</div></div>
          <span class="mini-bar-count">${20-validCount}</span>
        </div>
      </div>
      <div class="progress-strip">
        ${items.map(it=>`<div class="progress-seg" style="flex:1;background:${it.valid?'#4caf50':'#ef5350'}" title="Soal ${it.i+1}: ${f(it.rpbis)}"></div>`).join('')}
      </div>
      <p style="font-size:.72rem;color:#aaa;margin-top:6px">Hijau = valid · Merah = tidak valid (hover untuk nilai)</p>
    </div>
    <div class="sub-card">
      <h3>5 Butir Paling Valid</h3>
      ${[...items].sort((a,b)=>b.rpbis-a.rpbis).slice(0,5).map(it=>`
      <div class="mini-bar-row" style="margin-bottom:5px">
        <span class="mini-bar-lbl">Soal ${it.i+1}</span>
        <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${Math.max(0,Math.min(100,it.rpbis*100))}%;background:${it.valid?'#667eea':'#ef5350'}">${f(it.rpbis)}</div></div>
      </div>`).join('')}
    </div>
  </div>
  <div class="tbl-wrap"><table>
  <thead><tr><th>No</th><th>Kunci</th><th>M_p</th><th>M_t</th><th>S_t</th><th>p</th><th>q</th><th>√(p/q)</th><th>r_pbis</th><th>Keterangan</th></tr></thead>
  <tbody>${items.map(it=>`<tr>
    <td>${dot(it.i)}</td><td><b>${it.k}</b></td>
    <td>${f(it.Mp)}</td><td>${f(Mt)}</td><td>${f(St)}</td>
    <td>${f(it.P)}</td><td>${f(it.q)}</td>
    <td>${f(it.P>0&&it.q>0?Math.sqrt(it.P/it.q):0)}</td>
    <td><b>${f(it.rpbis)}</b></td><td>${pValid(it.valid)}</td>
  </tr>`).join('')}</tbody>
  </table></div>
</div>`;

// TINGKAT KESUKARAN
document.getElementById('tab-kesukaran').innerHTML=`
<div class="card">
  <h2>Tingkat Kesukaran Butir Soal</h2>
  <div class="formula-box">P = B / N</div>
  <table class="crit-table" style="max-width:400px;margin-bottom:16px">
    <thead><tr><th>Nilai P</th><th>Kategori</th></tr></thead>
    <tbody>
      <tr><td>P &lt; 0,30</td><td><span class="pill p-sukar">Sukar</span></td></tr>
      <tr><td>0,30 ≤ P ≤ 0,70</td><td><span class="pill p-sedang">Sedang</span></td></tr>

function showTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}
